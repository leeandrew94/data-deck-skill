<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 替换为演示标题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== 主题变量（4 套预设，只选不自定义） ========== */
/* 默认: 数据科技 · 技术蓝 */
:root{
  --bg-primary:#0f172a;
  --bg-secondary:#1e293b;
  --bg-card:#1e293b;
  --text-primary:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --accent:#38bdf8;
  --accent-2:#818cf8;
  --accent-3:#34d399;
  --accent-4:#fb923c;
  --accent-light:rgba(56,189,248,.12);
  --border:#334155;
  --border-light:#475569;
  --shadow:none;
  --card-shadow:0 0 0 1px var(--border);
  --radius:6px;
  --font-sans:'Inter','Noto Sans SC',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --kpi-font-size:min(8vw,72px);
  --slide-padding:6vh 6vw;
  --gap:16px;
  --transition:transform .6s cubic-bezier(.4,0,.2,1);
  --cover-gradient:linear-gradient(160deg,var(--bg-primary) 0%,var(--bg-secondary) 100%);
  --kpi-accent-bar:4px;
  --anim-duration:.6s;
}

/* ========== Reset ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}

/* ========== Deck 容器 ========== */
#deck{position:fixed;inset:0;display:flex;flex-wrap:nowrap;transition:var(--transition);z-index:10;will-change:transform}
.slide{width:100vw;height:100vh;flex:0 0 100vw;position:relative;padding:var(--slide-padding);display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary)}

/* ========== 页眉页脚 ========== */
.chrome{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);opacity:.7}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--text-muted);opacity:.5}

/* ========== 导航点 ========== */
#nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:100}
#nav .dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);opacity:.3;cursor:pointer;transition:all .3s}
#nav .dot.active{opacity:1;background:var(--accent);transform:scale(1.3)}

/* ========== 封面 ========== */
.cover{justify-content:center;align-items:center;text-align:center}
.cover .title{font-size:min(7vw,80px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:2vh}
.cover .subtitle{font-size:min(2vw,24px);color:var(--text-secondary);font-weight:300}
.cover .meta{margin-top:4vh;font-family:var(--font-mono);font-size:13px;color:var(--text-muted);letter-spacing:.1em}

/* ========== KPI 大字报 ========== */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--gap);margin:4vh 0}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;display:flex;flex-direction:column}
.kpi-card .label{font-size:13px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.kpi-card .value{font-family:var(--font-mono);font-size:var(--kpi-font-size);font-weight:600;line-height:1;color:var(--accent)}
.kpi-card .change{font-family:var(--font-mono);font-size:14px;margin-top:8px}
.kpi-card .change.up{color:var(--accent-3)}
.kpi-card .change.down{color:#f87171}
.kpi-card .change.neutral{color:var(--text-muted)}
.kpi-card .note{font-size:12px;color:var(--text-muted);margin-top:6px}

/* ========== 图表容器 ========== */
.chart-row{display:grid;gap:var(--gap);flex:1;min-height:0}
.chart-row.cols-1{grid-template-columns:1fr}
.chart-row.cols-2{grid-template-columns:1fr 1fr}
.chart-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.chart-row.ratio-6-4{grid-template-columns:6fr 4fr}
.chart-row.ratio-7-3{grid-template-columns:7fr 3fr}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chart-box .chart-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;flex-shrink:0}
.chart-box .chart-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:12px;flex-shrink:0}
.chart-box .chart-area{flex:1;min-height:0;position:relative}

/* ========== 洞察/文本页 ========== */
.insight-slide{justify-content:center;max-width:72vw;margin:0 auto}
.insight-slide .section-label{font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:3vh}
.insight-slide h2{font-size:min(4vw,48px);font-weight:600;line-height:1.2;margin-bottom:3vh}
.insight-slide .insight-list{list-style:none;display:flex;flex-direction:column;gap:2vh}
.insight-slide .insight-list li{font-size:min(1.6vw,20px);color:var(--text-secondary);line-height:1.6;padding-left:24px;position:relative}
.insight-slide .insight-list li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:8px;background:var(--accent);border-radius:2px}

/* ========== 表格 ========== */
.data-table-wrap{overflow:auto;flex:1;min-height:0}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{position:sticky;top:0;background:var(--bg-secondary);font-weight:600;text-align:left;padding:10px 14px;border-bottom:2px solid var(--border);color:var(--text-primary);white-space:nowrap}
.data-table td{padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);white-space:nowrap}
.data-table tr:hover td{background:var(--accent-light)}
.data-table .num{text-align:right;font-family:var(--font-mono)}

/* ========== 结束页 ========== */
.closing{justify-content:center;align-items:center;text-align:center}
.closing .end-title{font-size:min(5vw,56px);font-weight:700;line-height:1.15;margin-bottom:3vh}
.closing .end-sub{font-size:min(1.8vw,22px);color:var(--text-secondary);font-weight:300;max-width:600px}

/* ========== 封面 & 结束页渐变 ========== */
.cover,.closing{background:var(--cover-gradient)}

/* ========== 封面装饰线 ========== */
.cover .accent-line{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:2vh auto 0}

/* ========== KPI 卡片增强 ========== */
.kpi-card{border-left:var(--kpi-accent-bar) solid var(--accent);transition:transform .25s,box-shadow .25s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow),0 6px 20px rgba(0,0,0,.12)}
.kpi-card .value-wrap{background:var(--accent-light);border-radius:4px;padding:8px 12px;margin:-4px -8px 0}

/* ========== 图表卡片增强 ========== */
.chart-box .chart-title{padding-bottom:10px;border-bottom:1px solid var(--border)}
.chart-box .chart-area{background:var(--bg-secondary);border-radius:4px;margin-top:8px;padding:4px}

/* ========== 洞察页增强 ========== */
.insight-slide{border-left:3px solid var(--accent);padding-left:32px}

/* ========== 进入动画 ========== */
.reveal{opacity:0;transition:opacity var(--anim-duration) ease,transform var(--anim-duration) ease}
.reveal[data-anim="up"]{transform:translateY(30px)}
.reveal[data-anim="left"]{transform:translateX(-30px)}
.reveal[data-anim="fade"]{transform:none}
.reveal.visible{opacity:1;transform:none}

/* ========== 顶部进度条 ========== */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:200;transition:width .3s;width:0}

/* ========== 标题副标题通用 ========== */
.slide-title{font-size:min(3.5vw,40px);font-weight:700;line-height:1.2;margin-bottom:1vh}
.slide-subtitle{font-size:min(1.4vw,18px);color:var(--text-secondary);font-weight:300;margin-bottom:3vh}

/* ========== 分割线 ========== */
.rule{width:100%;height:1px;background:var(--border);margin:3vh 0}

/* ========== 低功耗模式 ========== */
body.low-power .echarts-toolbar{display:none!important}
body.low-power .reveal{opacity:1!important;transform:none!important;transition:none!important}
body.low-power .kpi-card{transition:none!important;transform:none!important}
body.low-power .chart-box{transition:none!important}
body.low-power #progress-bar{transition:none!important}
body.low-power .dot{transition:none!important}
body.low-power *{animation:none!important;transition:none!important}
body.low-power::after{
  content:'低功耗模式 (按 B 退出)';
  position:fixed;bottom:8px;right:16px;
  font-family:var(--font-mono);font-size:11px;
  color:var(--text-muted);opacity:.6;
  z-index:1000;pointer-events:none;
}

/* ========== 打印 ========== */
@media print{
  body{overflow:visible}
  #deck{position:static;display:block;flex-direction:row;overflow:visible;transition:none}
  .slide{page-break-after:always;height:auto;min-height:100vh;width:100%;flex:none}
  #nav,#progress-bar{display:none}
  .chrome,.foot{opacity:1}
  .reveal{opacity:1!important;transform:none!important}
}

/* ========== 响应式 ========== */
@media(max-width:1280px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .chart-row.cols-2,.chart-row.ratio-6-4,.chart-row.ratio-7-3{grid-template-columns:1fr}
  :root{--slide-padding:4vh 4vw}
}

/* 手机端：垂直滚动模式 */
@media(max-width:768px){
  :root{--slide-padding:5vh 5vw;--kpi-font-size:min(12vw,48px);--gap:12px}
  #deck{flex-direction:column;overflow-y:auto;overflow-x:hidden;position:static;height:auto;transition:none}
  .slide{width:100%;height:auto;min-height:100vh;min-height:100dvh;flex:0 0 auto;padding:var(--slide-padding)}
  #nav{display:none}
  .cover .title{font-size:min(9vw,36px)}
  .cover .subtitle{font-size:min(4vw,18px)}
  .cover .meta{font-size:11px}
  .slide-title{font-size:min(5.5vw,24px)}
  .slide-subtitle{font-size:min(3.5vw,15px)}
  .insight-slide h2{font-size:min(6vw,28px)}
  .insight-slide .insight-list li{font-size:min(4vw,16px)}
  .closing .end-title{font-size:min(8vw,32px)}
  .closing .end-sub{font-size:min(4vw,17px)}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-card{padding:16px 18px}
  .kpi-card .label{font-size:11px;margin-bottom:8px}
  .chart-row{gap:12px}
  .chart-row.cols-2,.chart-row.cols-3,.chart-row.ratio-6-4,.chart-row.ratio-7-3{grid-template-columns:1fr}
  .chart-box{min-height:280px}
  .chart-box .chart-title{font-size:13px}
  .chrome{font-size:10px}
  .foot{font-size:10px}
  .data-table{font-size:12px}
  .data-table th,.data-table td{padding:6px 10px}
  .insight-slide{max-width:90vw;border-left-width:2px;padding-left:20px}
}

/* 小手机 */
@media(max-width:480px){
  :root{--slide-padding:4vh 4vw;--kpi-font-size:min(14vw,40px)}
  .cover .title{font-size:min(10vw,30px)}
  .kpi-row{grid-template-columns:1fr 1fr}
  .kpi-card{padding:14px 14px}
  .kpi-card .value-wrap{padding:6px 8px}
  .chart-box{min-height:240px}
}
</style>
</head>
<body>

<div id="deck">
  <!-- DECK_SLIDES_HERE -->
</div>

<div id="nav"></div>
<div id="progress-bar"></div>

<script>
/* ========== ECharts 加载器（CDN + 本地兜底） ========== */
(function(){
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src;
      s.onload=resolve;
      s.onerror=reject;
      document.head.appendChild(s);
    });
  }
  var cdn='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';
  var local='echarts.min.js';
  loadScript(cdn).catch(function(){return loadScript(local)}).then(function(){
    window.dispatchEvent(new Event('echarts-ready'));
  }).catch(function(){
    console.error('ECharts load failed');
  });
})();

/* ========== 翻页引擎 ========== */
(function(){
  var deck=document.getElementById('deck');
  var slides=deck.querySelectorAll('.slide');
  var nav=document.getElementById('nav');
  var progressBar=document.getElementById('progress-bar');
  var current=0;
  var total=slides.length;
  var isMobile=window.innerWidth<=768;

  // ─── 进度条更新 ───
  function updateProgress(n){
    if(progressBar) progressBar.style.width=((n+1)/total*100)+'%';
  }

  // ─── 导航点（桌面端） ───
  if(!isMobile){
    for(var i=0;i<total;i++){
      var dot=document.createElement('div');
      dot.className='dot'+(i===0?' active':'');
      dot.setAttribute('data-index',i);
      dot.addEventListener('click',function(){goTo(parseInt(this.getAttribute('data-index')))});
      nav.appendChild(dot);
    }
  }

  function goTo(n){
    if(n<0||n>=total)return;
    current=n;
    if(!isMobile){
      deck.style.transform='translateX(-'+current*100+'vw)';
      var dots=nav.querySelectorAll('.dot');
      dots.forEach(function(d,i){d.classList.toggle('active',i===current)});
    }else{
      // 移动端：滚动到对应 slide
      slides[current].scrollIntoView({behavior:'smooth'});
    }
    updateProgress(current);
    setTimeout(function(){
      window.dispatchEvent(new Event('resize'));
      window.dispatchEvent(new CustomEvent('slide-change',{detail:{index:current}}));
    },300);
  }

  // ─── 桌面端：键盘翻页 ───
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' ')goTo(current+1);
    if(e.key==='ArrowLeft')goTo(current-1);
    if(e.key==='Home')goTo(0);
    if(e.key==='End')goTo(total-1);
    if(e.key==='b'||e.key==='B'){
      document.body.classList.toggle('low-power');
      // 低功耗模式切换时，强制显示当前页所有动画元素
      if(document.body.classList.contains('low-power')){
        var currentSlide=slides[current];
        if(currentSlide){
          currentSlide.querySelectorAll('.reveal').forEach(function(el){
            el.style.opacity='1';
            el.style.transform='none';
          });
        }
      }
    }
  });

  // ─── 桌面端：滚轮翻页 ───
  if(!isMobile){
    var wheelTimer=null;
    document.addEventListener('wheel',function(e){
      if(wheelTimer)return;
      wheelTimer=setTimeout(function(){wheelTimer=null},800);
      if(e.deltaY>0)goTo(current+1);
      else if(e.deltaY<0)goTo(current-1);
    },{passive:true});
  }

  // ─── 桌面端：触屏翻页 ───
  if(!isMobile){
    var touchStartX=0;
    document.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX},{passive:true});
    document.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-touchStartX;
      if(Math.abs(dx)>60){
        if(dx<0)goTo(current+1);
        else goTo(current-1);
      }
    },{passive:true});
  }

  // ─── 移动端：滚动时更新当前页和进度条 ───
  if(isMobile){
    var scrollTimer=null;
    var scrollTarget=deck.scrollHeight>deck.clientHeight?deck:window;
    (scrollTarget===window?document:deck).addEventListener('scroll',function(){
      if(scrollTimer)clearTimeout(scrollTimer);
      scrollTimer=setTimeout(function(){
        var scrollTop=scrollTarget===window?window.pageYOffset:deck.scrollTop;
        for(var i=0;i<total;i++){
          var el=slides[i];
          var top=el.offsetTop;
          var h=el.offsetHeight;
          if(scrollTop>=top-h*0.4&&scrollTop<top+h*0.6){
            if(current!==i){
              current=i;
              updateProgress(current);
              window.dispatchEvent(new CustomEvent('slide-change',{detail:{index:current}}));
            }
            break;
          }
        }
      },100);
    },{passive:true});
  }

  // ESC
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')goTo(0);
  });

  updateProgress(0);
  window.deckGoTo=goTo;
  window.isMobileMode=isMobile;
})();

/* ========== 图表自适应 ========== */
(function(){
  var charts=[];
  window.registerChart=function(instance){
    charts.push(instance);
  };
  window.addEventListener('resize',function(){
    charts.forEach(function(c){c.resize && c.resize()});
  });
  window.addEventListener('slide-change',function(){
    charts.forEach(function(c){c.resize && c.resize()});
  });
})();

/* ========== Reveal 进入动画 ========== */
(function(){
  var reveals=document.querySelectorAll('.reveal');
  if(!reveals.length)return;
  // IntersectionObserver（移动端滚动时自然触发，桌面端在 slide-change 时触发）
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    },{threshold:0.15});
    reveals.forEach(function(el){obs.observe(el)});
  }else{
    // 降级：直接显示
    reveals.forEach(function(el){el.classList.add('visible')});
  }
  // 桌面端：slide 切换时触发当前页的 reveal
  window.addEventListener('slide-change',function(ev){
    var idx=ev.detail.index;
    var slide=document.querySelectorAll('.slide')[idx];
    if(slide){
      slide.querySelectorAll('.reveal').forEach(function(el){el.classList.add('visible')});
    }
  });
})();

/* ========== 数字格式化工具 ========== */
window.fmt={
  // 12345 → 12,345
  num:function(v,d){
    if(v==null)return '—';
    var n=Number(v);
    if(isNaN(n))return v;
    return n.toLocaleString('zh-CN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
  },
  // 12345 → 1.2万
  cn:function(v){
    if(v==null)return '—';
    var n=Number(v);
    if(isNaN(n))return v;
    if(Math.abs(n)>=1e8)return (n/1e8).toFixed(1)+'亿';
    if(Math.abs(n)>=1e4)return (n/1e4).toFixed(1)+'万';
    return n.toLocaleString('zh-CN');
  },
  // 0.1234 → 12.34%
  pct:function(v,d){
    if(v==null)return '—';
    var n=Number(v);
    if(isNaN(n))return v;
    // 如果已经是百分比形式（>1），直接加%
    if(Math.abs(n)>1 && Math.abs(n)<=100)return n.toFixed(d||1)+'%';
    return (n*100).toFixed(d||1)+'%';
  },
  // 12345 → ¥12,345
  currency:function(v,sym){
    if(v==null)return '—';
    var n=Number(v);
    if(isNaN(n))return v;
    return (sym||'¥')+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  },
  // 日期格式化
  date:function(v,fmt){
    if(!v)return '—';
    var d=new Date(v);
    if(isNaN(d))return v;
    var Y=d.getFullYear(),M=String(d.getMonth()+1).padStart(2,'0'),D=String(d.getDate()).padStart(2,'0');
    if(fmt==='YM')return Y+'-'+M;
    if(fmt==='Y')return String(Y);
    return Y+'-'+M+'-'+D;
  }
};

/* ========== ECharts 主题注册 ========== */
window.addEventListener('echarts-ready',function(){
  // 从 CSS 变量读取当前主题色
  var cs=getComputedStyle(document.documentElement);
  var accent=cs.getPropertyValue('--accent').trim();
  var accent2=cs.getPropertyValue('--accent-2').trim();
  var accent3=cs.getPropertyValue('--accent-3').trim();
  var accent4=cs.getPropertyValue('--accent-4').trim();
  var textPrimary=cs.getPropertyValue('--text-primary').trim();
  var textSecondary=cs.getPropertyValue('--text-secondary').trim();
  var textMuted=cs.getPropertyValue('--text-muted').trim();
  var border=cs.getPropertyValue('--border').trim();
  var bgCard=cs.getPropertyValue('--bg-card').trim();

  echarts.registerTheme('data-deck',{
    color:[accent,accent2,accent3,accent4,'#f472b6','#a78bfa','#fbbf24','#22d3ee'],
    backgroundColor:'transparent',
    textStyle:{fontFamily:'Inter, Noto Sans SC, sans-serif',color:textSecondary},
    title:{textStyle:{color:textPrimary,fontWeight:600,fontSize:14},subtextStyle:{color:textMuted,fontSize:12}},
    legend:{textStyle:{color:textSecondary,fontSize:12}},
    tooltip:{backgroundColor:bgCard,borderColor:border,textStyle:{color:textPrimary,fontSize:13}},
    categoryAxis:{axisLine:{lineStyle:{color:border}},axisTick:{lineStyle:{color:border}},axisLabel:{color:textMuted,fontSize:11},splitLine:{lineStyle:{color:border,opacity:.3}}},
    valueAxis:{axisLine:{show:false},axisTick:{show:false},axisLabel:{color:textMuted,fontSize:11},splitLine:{lineStyle:{color:border,opacity:.3}}},
    grid:{left:48,right:24,top:48,bottom:48,containLabel:true}
  });
